<header class="topbar">
  <div class="topbar-left">
    <button
      class="menu-button"
      id="menuButton"
      type="button"
      aria-label="Mở menu"
    >
      <i class="fa-solid fa-bars"></i>
    </button>

    <div class="page-title">
      <h1 id="pageTitle">Tổng quan</h1>

      <p id="pageDescription">Theo dõi và quản lý ngôi nhà của bạn</p>
    </div>
  </div>

  <div class="topbar-right">
    <button type="button" class="notification-button" aria-label="Thông báo">
      <i class="fa-regular fa-bell"></i>

      <span class="notification-dot"></span>
    </button>

    <div class="user-profile">
      <div class="user-avatar">
        <i class="fa-solid fa-user"></i>
      </div>

      <div class="user-info">
        <strong id="userName"> Người dùng </strong>

        <span id="userRole"> User </span>
      </div>

      <i class="fa-solid fa-chevron-down user-arrow"></i>
    </div>
  </div>
</header>
