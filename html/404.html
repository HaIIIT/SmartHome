<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Smart Home | Chức năng đang phát triển</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="../css/404.css" />
  </head>

  <body>
    <main class="error-page">
      <a href="dashboard.html" class="brand">
        <img src="../img/logo.png" alt="Smart Home" />
      </a>

      <section class="error-card">
        <div class="illustration">
          <div class="circle circle-one"></div>
          <div class="circle circle-two"></div>

          <div class="house-icon">
            <i class="fa-solid fa-house-signal"></i>
          </div>

          <div class="tool-icon tool-one">
            <i class="fa-solid fa-gear"></i>
          </div>

          <div class="tool-icon tool-two">
            <i class="fa-solid fa-code"></i>
          </div>
        </div>

        <div class="error-code">404</div>

        <p class="eyebrow">SMART HOME SYSTEM</p>

        <h1>Chức năng đang được phát triển</h1>

        <p class="description">
          Tính năng bạn vừa chọn hiện chưa được hoàn thiện. Chúng tôi đang xây
          dựng để sớm đưa chức năng này vào hệ thống Smart Home.
        </p>

        <div class="development-status">
          <div class="status-heading">
            <div>
              <i class="fa-solid fa-screwdriver-wrench"></i>
              <span>Đang xây dựng</span>
            </div>
            <strong>Coming soon</strong>
          </div>

          <div class="progress-track">
            <span></span>
          </div>
        </div>

        <div class="error-actions">
          <button type="button" class="back-button" id="backButton">
            <i class="fa-solid fa-arrow-left"></i>
            Quay lại
          </button>

          <a href="dashboard.html" class="home-button">
            <i class="fa-solid fa-house"></i>
            Về trang tổng quan
          </a>
        </div>
      </section>

      <p class="footer-text">Smart Home · Hệ thống quản lý nhà thông minh</p>
    </main>

    <script src="../js/404.js"></script>
  </body>
</html>
